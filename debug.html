<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug JS</title>
</head>
<body style="font-family:sans-serif;font-size:22px;padding:24px;line-height:1.9;background:#fff;color:#111">
<div id="out">JS BELUM JALAN</div>
<script>
document.getElementById('out').textContent =
  "JS JALAN | reduce-motion=" + (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) +
  " | IO-support=" + ('IntersectionObserver' in window);
</script>
</body>
</html>
